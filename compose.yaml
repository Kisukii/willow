services:
  willow:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in your environment or .env}
      DATABASE_PATH: /data/infrawatch.db
      CHECK_INTERVAL: "15"
      DEMO_ENABLED: "true"
    volumes:
      - monitoring-data:/data
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
volumes:
  monitoring-data:
